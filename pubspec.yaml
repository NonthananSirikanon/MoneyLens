name: moneylens
description: "MoneyLens — offline-first personal finance with slip import."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  crypto: ^3.0.7
  drift: ^2.35.2
  drift_flutter: ^0.3.1
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.2
  image_picker: ^1.2.4
  intl: ^0.20.3
  path_provider: ^2.1.6
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  build_runner: ^2.16.2
  drift_dev: ^2.35.1
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
