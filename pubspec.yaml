name: moneylens
description: "MoneyLens — offline-first personal finance with slip import."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  crypto: ^3.0.7
  drift: ^2.35.2
  drift_flutter: ^0.3.1
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.2
  image_picker: ^1.2.4
  intl: ^0.20.3
  path_provider: ^2.1.6
  uuid: ^4.6.0
  forui: ^0.27.7
  flutter_animate: ^4.5.2
  fl_chart: ^1.3.0
  supabase_flutter: ^2.18.3
  path: ^1.9.1
  http: ^1.6.0
  share_plus: ^13.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  build_runner: ^2.16.2
  drift_dev: ^2.35.1
  flutter_lints: ^6.0.0
  fake_async: ^1.3.3

flutter:
  uses-material-design: true
  generate: true

  # Illustrations and the sample slip come from design/mockups/assets.
  assets:
    - assets/images/

  # Bundled (not fetched) because the app is offline-first. Static instances
  # cut from the Google Fonts variable files; licenses sit next to them.
  fonts:
    - family: NotoSansThai
      fonts:
        - asset: assets/fonts/NotoSansThai-400.ttf
          weight: 400
        - asset: assets/fonts/NotoSansThai-500.ttf
          weight: 500
        - asset: assets/fonts/NotoSansThai-600.ttf
          weight: 600
        - asset: assets/fonts/NotoSansThai-700.ttf
          weight: 700
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-400.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-500.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-600.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-700.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-800.ttf
          weight: 800
